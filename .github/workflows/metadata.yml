# Metadata pipeline: runs when records or schemas change. Validates every
# record, checks ID permanence against the base branch and verifies that
# the committed retrieval index matches the records.
name: metadata

on:
  pull_request:
    paths:
      - "metadata/**"
      - "system/schemas/**"
      - "system/registry/knowledge-graph.yaml"
  push:
    branches: [main]
    paths:
      - "metadata/**"
      - "system/schemas/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate records (fail on major)
        run: |
          base=""
          if [ -n "${GITHUB_BASE_REF}" ]; then
            base="--base-ref origin/${GITHUB_BASE_REF}"
          fi
          python scripts/validate-metadata.py --fail-on major $base \
            | tee metadata-report.txt
      - name: Report minor findings
        if: always()
        run: python scripts/validate-metadata.py --fail-on critical >> "$GITHUB_STEP_SUMMARY" || true
      - name: Retrieval index is current
        run: python scripts/build-index.py --check
