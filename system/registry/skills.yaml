    input: Passage or word list, root lexicon excerpt.
    output: Root cards with occurrences and meanings.
    dependencies: [source-retrieval]
    complexity_class: B
    execution: hybrid
    recommended_model: sonnet
    fallback_model: opus
    token_budget: {input: 8000, output: 2000}

  - skill_id: reflection-prompting
    name: Reflection Prompting
    purpose: Generate questions that lead from an idea to personal action.
