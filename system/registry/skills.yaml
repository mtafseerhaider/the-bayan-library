# Skill registry. A skill is a reusable, documented procedure with a fixed
# input and output contract. Agents compose skills; skills compose other
# skills through `dependencies` (which must form a DAG).
#
# execution:
#   script  - deterministic code, no model call
#   hybrid  - script first, model only for what the script cannot decide
#   model   - model call with the recommended model class
#
# Models are class names resolved through models.yaml. Token budgets are
# per invocation and may not exceed the recommended model's cap.
#
# A skill always runs on its own recommended model, whatever the class of
# the agent invoking it: a class A agent that uses a class B skill pays
# for one sonnet call for that step only. The router records it as the
# skill's class, not as an escalation.

version: 1

skills:
  # ------------------------------------------------------------ Class A
  - skill_id: source-retrieval
    name: Source Retrieval
    purpose: Assemble the minimum context for a task via the retrieval ladder.
    input: Task spec, target IDs, token budget.
    output: Context pack (cards, summaries, excerpts) with token count.
    dependencies: []
    complexity_class: A
    execution: hybrid
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 6000, output: 800}

  - skill_id: graph-query
    name: Graph Query
    purpose: Return a bounded neighbourhood of the knowledge graph.
    input: Seed IDs, relationship filter, depth (max 2), map ID.
    output: Node cards and typed edges with evidence levels.
    dependencies: []
    complexity_class: A
    execution: script
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 0, output: 0}

  - skill_id: context-compression
    name: Context Compression
    purpose: Shrink retrieved context to the budget without losing claims.
    input: Context pack, target token count, must-keep facts.
    output: Compressed pack plus a list of dropped items.
    dependencies: []
    complexity_class: A
    execution: model
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 10000, output: 2000}

  - skill_id: knowledge-compression
    name: Knowledge Compression
    purpose: Produce the four idea-compression levels for a note or summary.
    input: Reviewed summary or note.
    output: Paragraph, sentence, phrase and keyword forms.
    dependencies: []
    complexity_class: A
    execution: model
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 4000, output: 600}

  - skill_id: terminology-glossing
    name: Terminology Glossing
    purpose: Detect technical terms and attach plain-language footnotes.
    input: Draft text, glossary excerpt.
    output: Text with footnoted terms and new glossary candidates.
    dependencies: []
    complexity_class: A
    execution: model
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 6000, output: 1500}

  - skill_id: markdown-formatting
    name: Markdown Formatting
    purpose: Conform a document to the templates and markdownlint rules.
    input: Draft Markdown, template ID.
    output: Lint-clean Markdown.
    dependencies: []
    complexity_class: A
    execution: hybrid
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 8000, output: 2000}

  - skill_id: link-validation
    name: Link Validation
    purpose: Find broken internal links and dangling IDs.
    input: Changed files or whole repository.
    output: Findings list with file and line.
    dependencies: []
    complexity_class: A
    execution: script
    recommended_model: haiku
    fallback_model: haiku
    token_budget: {input: 0, output: 0}

  - skill_id: metadata-validation
    name: Metadata Validation
    purpose: Validate records against JSON Schemas and referential integrity.
    input: Metadata records.
    output: Findings classified critical, major or minor.
    dependencies: []
    complexity_class: A
    execution: script
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 0, output: 0}

  - skill_id: tag-generation
    name: Tag Generation
    purpose: Assign tags from the controlled vocabulary only.
    input: Record card, summary, tag vocabulary.
    output: Up to 8 tags, each from metadata/tags.yaml.
    dependencies: [source-retrieval]
    complexity_class: A
    execution: model
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 3000, output: 200}

  - skill_id: duplicate-detection
    name: Duplicate Detection
    purpose: Catch duplicate records, aliases and transliteration variants.
    input: Candidate record, index cards.
    output: Likely duplicates with similarity scores.
    dependencies: [source-retrieval]
    complexity_class: A
    execution: hybrid
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 4000, output: 500}

  - skill_id: difficulty-assessment
    name: Difficulty Assessment
    purpose: Score a work on the difficulty matrix of docs/19.
    input: Record card, executive summary, sample passage.
    output: Scores per dimension, overall level, rationale.
    dependencies: [source-retrieval]
    complexity_class: A
    execution: model
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 5000, output: 600}

  - skill_id: spaced-repetition-scheduling
    name: Spaced Repetition Scheduling
    purpose: Schedule reviews at 1, 7, 30, 90 and 365 days.
    input: Review history.
    output: Due-review queue.
    dependencies: []
    complexity_class: A
    execution: script
    recommended_model: haiku
    fallback_model: haiku
    token_budget: {input: 0, output: 0}

  - skill_id: daily-selection
    name: Daily Selection
    purpose: Pick the day's item from the library without repeats.
    input: Practice type, calendar theme, history of past picks.
    output: Selected record ID with reason.
    dependencies: [source-retrieval, duplicate-detection]
    complexity_class: A
    execution: hybrid
    recommended_model: haiku
    fallback_model: sonnet
    token_budget: {input: 3000, output: 300}

  - skill_id: cost-reporting
    name: Cost Reporting
    purpose: Aggregate the usage ledger against budgets.
    input: Usage ledger (JSONL), budgets.yaml.
    output: Markdown cost report with alerts.
    dependencies: []
    complexity_class: A
    execution: script
    recommended_model: haiku
    fallback_model: haiku
    token_budget: {input: 0, output: 0}

