    output: has_theme and uses_root proposals with citations.
    dependencies: [arabic-root-extraction, graph-query, citation-verification]
    complexity_class: C
    execution: model
    recommended_model: sonnet
    fallback_model: opus
    token_budget: {input: 20000, output: 3000}

