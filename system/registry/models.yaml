# Model catalog: the single place where model classes map to concrete IDs.
#
# Agents, skills and routing rules refer to model *classes* (haiku, sonnet,
# opus), never to dated IDs. When a model generation changes, update this
# file only; every registry entry follows automatically.
#
# Prices are USD per million tokens, Anthropic first-party API rates, as
# cached on 2026-10-06. Re-verify before relying on them for a budget.

version: 1
last_reviewed: 2026-10-13
currency: USD

models:
  haiku:
    model_id: claude-haiku-5-5
    display_name: Claude Haiku 5.5
    role: Fast, inexpensive model for simple, high-volume, well-specified work.
    context_window: 1000000
    max_output_tokens: 128000
    default_effort: low
    pricing:
      input_per_mtok: 0.10
      output_per_mtok: 0.50
      # Haiku 5.5 bills prompts above 100K tokens at a higher rate. Our
      # budget cap (10K input) keeps every request on the lower tier.
      long_context_threshold_tokens: 100000
      long_context_input_per_mtok: 0.50
      long_context_output_per_mtok: 2.50
      cache_read_per_mtok: 0.01   # assumption: 10% of input; verify
    budget:
      max_input_tokens: 10000
      max_output_tokens: 2000

  sonnet:
    model_id: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    role: Balanced model for summaries, notes, analysis and most synthesis.
    context_window: 1000000
    max_output_tokens: 128000
    default_effort: medium
    pricing:
      input_per_mtok: 2.00
      output_per_mtok: 10.00
      cache_read_per_mtok: 0.20
    budget:
      max_input_tokens: 30000
      max_output_tokens: 5000

  opus:
    model_id: claude-opus-5-5
    display_name: Claude Opus 5.5
    role: Most capable routed model, reserved for expert and strategic work.
    context_window: 1000000
    max_output_tokens: 128000
    default_effort: high
    pricing:
      input_per_mtok: 4.00
      output_per_mtok: 20.00
      cache_read_per_mtok: 0.20   # published rate (5% of input)
    budget:
      max_input_tokens: 100000
      max_output_tokens: 10000

# Discounts that apply across models.
discounts:
  batch_api_multiplier: 0.5        # Message Batches API: 50% of list price
  cache_write_note: >-
    Cache writes are billed slightly above base input; reads are billed at
    cache_read_per_mtok. Stable prefixes (system prompt, registry excerpts,
    style guide) must come first so they cache.

# Ordered from smallest to largest. The router never skips a rung when
# escalating and never climbs past opus.
escalation_ladder: [haiku, sonnet, opus]
